# DB + App + Tests (PIA). Uso:
#   docker compose up --build -d db app        -> http://localhost:8000
#   docker compose run --rm tests              -> pruebas contra PostgreSQL
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autofix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autofix}
      POSTGRES_DB: ${POSTGRES_DB:-autofixpro}
    volumes:
      - datos_postgres:/var/lib/postgresql/data
      - ./docker/crear_bd_pruebas.sql:/docker-entrypoint-initdb.d/crear_bd_pruebas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autofix} -d ${POSTGRES_DB:-autofixpro}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-autofix}:${POSTGRES_PASSWORD:-autofix}@db:5432/${POSTGRES_DB:-autofixpro}
      CARGAR_DATOS_DEMO: "true"
      PLAZO_DE_RESPUESTA_HORAS: ${PLAZO_DE_RESPUESTA_HORAS:-24}
    ports:
      - "8000:8000"

  tests:
    build: .
    profiles: ["test"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-autofix}:${POSTGRES_PASSWORD:-autofix}@db:5432/autofixpro_pruebas
    command: ["python", "-m", "pytest", "--cov", "--cov-report=term", "--cov-fail-under=80"]

volumes:
  datos_postgres:
